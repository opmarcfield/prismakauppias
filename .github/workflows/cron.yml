name: Stock Monitors

on:
  repository_dispatch:
    types: [trigger-monitor] # Allows execution via your external cron webhook URL
  workflow_dispatch:   # Allows manual execution from the GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install requests beautifulsoup4

    # 💾 RESTORE PREVIOUS STATE FILES
    - name: Restore Inventory State Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          last_state.json
          muovitukku_state.json
        key: store-monitors-${{ github.run_id }}
        restore-keys: |
          store-monitors-

    # 🚀 RUN THE PRISMA MONITOR SCRIPT
    - name: Run Prisma Script
      run: python prisma_kauppias.py

    # 🚀 RUN THE MUOVITUKKU MONITOR SCRIPT
    - name: Run Muovitukku Script
      run: python muovitukkukauppias.py

    # 💾 SAVE UP-TO-DATE STATE FILES FOR THE NEXT RUN
    - name: Save Inventory State Cache
      uses: actions/cache/save@v4
      with:
        path: |
          last_state.json
          muovitukku_state.json
        key: store-monitors-${{ github.run_id }}