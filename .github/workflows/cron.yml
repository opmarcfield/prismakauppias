name: Prisma Stock Monitor

on:
  repository_dispatch:
    types: [trigger-monitor] # Allows execution via your external cron webhook URL
  workflow_dispatch:   # Allows manual execution from the GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-mode: '3.11'

    - name: Install Dependencies
      run: pip install requests

    # 💾 RESTORE PREVIOUS STATE FILE
    - name: Restore Inventory State Cache
      uses: actions/cache/restore@v4
      with:
        path: last_state.json
        key: prisma-stock-${{ github.run_id }}
        restore-keys: |
          prisma-stock-

    # 🚀 RUN THE PYTHON MONITOR SCRIPT
    - name: Run Script
      run: prisma_kauppias.py

    # 💾 SAVE UP-TO-DATE STATE FILE FOR THE NEXT RUN
    - name: Save Inventory State Cache
      uses: actions/cache/save@v4
      with:
        path: last_state.json
        key: prisma-stock-${{ github.run_id }}
